<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}" data-ground="ink">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title and page.title != 'Home' %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="author" content="Bruno Coelho">

    <link rel="canonical" href="{{ page.url | absolute_url }}">

    <meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta name="twitter:card" content="summary">

    {% include head-custom.html %}
  </head>

  <body>
    <a class="skip" href="#main">Skip to content</a>
    {% include masthead.html %}

    <main id="main" class="main-content" role="main">
      {{ content }}
    </main>

    <footer class="site-foot" role="contentinfo">
      <div class="site-foot-in">
        <p class="site-foot-owner"><strong>{{ site.title }}</strong>, curated by Bruno Coelho. Technology leadership across Europe, Asia-Pacific and the Middle East.</p>
        <nav class="site-foot-links" aria-label="Follow">
          <a href="{{ '/subscribe/' | relative_url }}">Subscribe</a>
          <a href="{{ '/feed-en.xml' | relative_url }}">RSS</a>
          <a href="https://www.linkedin.com/in/bracoelho/">LinkedIn</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
