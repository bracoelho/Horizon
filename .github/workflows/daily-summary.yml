name: Daily Horizon Summary

on:
  schedule:
    # Once daily at 21:07 UTC = 06:07 in Tokyo, so the edition is waiting
    # at the start of the owner's day. Off-the-hour to dodge the scheduler pile-up.
    - cron: '7 21 * * *'
  workflow_dispatch:       # allow manual trigger from the Actions tab

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit changes
      actions: read    # the health check reads previous run start times

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        # v7 is the highest floating major tag astral-sh publishes; v10 exists
        # only as pinned releases. v7 is node24, which clears the deprecation.
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
          # Horizon logs through rich, which falls back to 80 columns when
          # stdout is not a terminal and wraps the message into a narrow
          # column. Everything past that lands on continuation lines, so an
          # error read as "Error enriching item" with the item id and the
          # cause on the two lines below, where the health check does not
          # look. rich honours COLUMNS, so one line here keeps each log
          # record on one line and makes the run diagnosable.
          COLUMNS: "200"
        run: |
          set -o pipefail
          # 30h window on a daily cadence: 6h of deliberate overlap. Windows
          # that exactly abut the run interval leave a permanent gap, because an
          # item whose feed lags its own timestamp misses the run it belongs to
          # and the next window opens after it. Seen with a Verge item on
          # 2026-08-16.
          #
          # 26h was chosen when the scheduler ran under 35 minutes late. Between
          # 27 and 29 August it ran 218, 493 and 362 minutes late, and the gap
          # between consecutive starts reached 27.1h and 28.6h. Both exceeded
          # the window, so items existed that no run ever fetched. The overlap
          # has to cover the worst drift, not the typical drift. Costs a few
          # re-scored items a run, which is cheaper than a blind spot.
          uv run horizon --hours 30 2>&1 | tee horizon-run.log

      - name: "Run health check (BACKLOG #5/#6 - distinguish quiet from broken)"
        env:
          # Lets the check read the previous scheduled run's start time, so it
          # can compare the gap between runs against the window below.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/check_run_health.py horizon-run.log \
            --append-digest docs/_posts \
            --window-hours 30

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # keep existing summaries on gh-pages branch
          commit_message: "📝 Radar update: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true

      # Before the notification, because the message links a dispatch that
      # reads this file. The daily run proposes; the owner picks an angle from
      # his phone; Draft Commentary writes the piece hours later.
      - name: Keep the commentary proposal
        if: always()
        run: |
          set -e
          if [ ! -f data/commentary_proposal.json ]; then
            echo "No proposal this run. Nothing published, or nothing picked."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/commentary_proposal.json
          if git diff --cached --quiet; then
            echo "Proposal unchanged."
            exit 0
          fi
          git commit -m "Today's commentary candidate"
          git push

      # After the deploy so the link in the message actually resolves.
      # always() so a run that died earlier still notifies.
      - name: Notify via Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py --always

      # Runs AFTER deploy so a broken run still publishes its digest;
      # the red X on the run is the "go read the log" signal. Only errors that
      # damage the run count here. Items that published without their
      # background section are reported as warnings and leave the job green,
      # because a build that is red every day is a signal nobody reads.
      - name: Fail job if the run was damaged
        run: |
          ERRS=$(cat health_errors.txt 2>/dev/null || echo 0)
          if [ "$ERRS" -gt 0 ]; then
            echo "::error::$ERRS ERROR line(s) during Horizon run — digest may be silently incomplete. See health report in step summary."
            exit 1
          fi
