name: Daily Horizon Summary

on:
  schedule:
    # Once daily, off the hour to dodge the scheduler pile-up. 18:37 UTC =
    # 03:37 Tokyo. Moved from 21:07 on 2026-08-31 (#52): the owner's
    # meetings start 09:00 JST, and with GitHub's 2-8h scheduler
    # drift the old slot sometimes had not even finished by his 08:45
    # review. Even +4h drift now completes before 08:00 JST. The 30h
    # window anchors to run start, so the transition day only overlaps
    # more; no gap, no window change.
    - cron: '37 18 * * *'
  workflow_dispatch:       # allow manual trigger from the Actions tab

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit changes
      actions: read    # the health check reads previous run start times

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        # v7 is the highest floating major tag astral-sh publishes; v10 exists
        # only as pinned releases. v7 is node24, which clears the deprecation.
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
          # Horizon logs through rich, which falls back to 80 columns when
          # stdout is not a terminal and wraps the message into a narrow
          # column. Everything past that lands on continuation lines, so an
          # error read as "Error enriching item" with the item id and the
          # cause on the two lines below, where the health check does not
          # look. rich honours COLUMNS, so one line here keeps each log
          # record on one line and makes the run diagnosable.
          COLUMNS: "200"
        run: |
          set -o pipefail
          # 30h window on a daily cadence: 6h of deliberate overlap. Windows
          # that exactly abut the run interval leave a permanent gap, because an
          # item whose feed lags its own timestamp misses the run it belongs to
          # and the next window opens after it. Seen with a Verge item on
          # 2026-08-16.
          #
          # 26h was chosen when the scheduler ran under 35 minutes late. Between
          # 27 and 29 August it ran 218, 493 and 362 minutes late, and the gap
          # between consecutive starts reached 27.1h and 28.6h. Both exceeded
          # the window, so items existed that no run ever fetched. The overlap
          # has to cover the worst drift, not the typical drift. Costs a few
          # re-scored items a run, which is cheaper than a blind spot.
          uv run horizon --hours 30 2>&1 | tee horizon-run.log

      # The replay harness's raw material (PLAN-S1): the exact candidates
      # the ranker saw, uploaded so replay-rank.yml can re-run them.
      - name: Upload the rank fixture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank-fixture
          path: data/rank_fixture-*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: "Run health check (BACKLOG #5/#6 - distinguish quiet from broken)"
        env:
          # Lets the check read the previous scheduled run's start time, so it
          # can compare the gap between runs against the window below.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/check_run_health.py horizon-run.log \
            --append-digest docs/_posts \
            --window-hours 30

      # Before the deploy, so the row rides to the site with the run that
      # produced it. An observer, never a gate: if it fails the run still
      # publishes, which is why it is not chained into the health step.
      - name: Record the run in the metrics series
        if: always()
        run: python scripts/record_metrics.py || true

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # keep existing summaries on gh-pages branch
          commit_message: "📝 Radar update: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true

      # Before the notification, because the message links a dispatch that
      # reads this file. The daily run proposes; the owner picks an angle from
      # his phone; Draft Commentary writes the piece hours later.
      - name: Keep the commentary proposal
        if: always()
        run: |
          set -e
          if [ ! -f data/commentary_proposal.json ] && [ ! -f docs/assets/data/runs.json ]; then
            echo "Nothing to keep this run."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f data/commentary_proposal.json ] && git add -f data/commentary_proposal.json
          [ -f docs/assets/data/runs.json ] && git add docs/assets/data/runs.json
          true
          if git diff --cached --quiet; then
            echo "Proposal unchanged."
            exit 0
          fi
          git commit -m "Today's commentary candidate and metrics row"
          git push

      # Completion-triggered review (#44's fire half, decided 2026-09-01):
      # the Morning Review routine starts the moment the run ends, green or
      # red, which no clock can promise under scheduler drift. Fire-only
      # token; a failed fire never fails the build.
      - name: Fire the morning review routine
        if: always()
        env:
          FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$FIRE_URL" ] || [ -z "$FIRE_TOKEN" ]; then
            echo "Fire trigger not configured; skipping."; exit 0
          fi
          python3 - <<'PY' || echo "Fire failed; the 08:00 schedule still covers the review."
          import json, os, urllib.request
          funnel = {}
          try:
              funnel = json.load(open("health_summary.json")).get("totals", {})
          except Exception:
              pass
          text = (f"This run just completed with status {os.environ['JOB_STATUS']}. "
                  f"Funnel: {json.dumps(funnel)}. Run: {os.environ['RUN_URL']}. "
                  "Review it now instead of waiting for the schedule.")
          req = urllib.request.Request(
              os.environ["FIRE_URL"],
              data=json.dumps({"text": text[:60000]}).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['FIRE_TOKEN']}",
                  "anthropic-version": "2023-06-01",
                  "anthropic-beta": "experimental-cc-routine-2026-04-01",
                  "Content-Type": "application/json",
              })
          with urllib.request.urlopen(req, timeout=30) as resp:
              body = json.load(resp)
          print("Review session started:", body.get("claude_code_session_url", "?"))
          PY

      # After the deploy so the link in the message actually resolves.
      # always() so a run that died earlier still notifies.
      - name: Notify via Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py --always

      # Runs AFTER deploy so a broken run still publishes its digest;
      # the red X on the run is the "go read the log" signal. Only errors that
      # damage the run count here. Items that published without their
      # background section are reported as warnings and leave the job green,
      # because a build that is red every day is a signal nobody reads.
      - name: Fail job if the run was damaged
        run: |
          ERRS=$(cat health_errors.txt 2>/dev/null || echo 0)
          if [ "$ERRS" -gt 0 ]; then
            echo "::error::$ERRS ERROR line(s) during Horizon run — digest may be silently incomplete. See health report in step summary."
            exit 1
          fi
