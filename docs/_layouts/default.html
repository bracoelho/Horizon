<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title and page.title != 'Home' %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="author" content="Bruno Coelho">

    <link rel="canonical" href="{{ page.url | absolute_url }}">

    <meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta name="twitter:card" content="summary">

    {% include head-custom.html %}
  </head>

  <body>
    <header class="page-header" role="banner">
      <h1 class="project-name"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <p class="project-tagline">{{ site.description }}</p>
      <nav class="site-nav" aria-label="Main">
        <a href="{{ '/' | relative_url }}">Latest</a>
        <a href="{{ '/#commentary' | relative_url }}">Commentary</a>
        <a href="{{ '/subscribe/' | relative_url }}">Subscribe</a>
        <a href="{{ '/method/' | relative_url }}">Method</a>
      </nav>
      <nav class="site-nav-sub" aria-label="Playbook">
        <a href="{{ '/playbook/' | relative_url }}">Firsthand Playbook</a>
      </nav>
    </header>

    <main class="main-content" role="main">
      {{ content }}

      <footer class="site-footer">
        <p class="site-footer-owner">
          <strong>{{ site.title }}</strong>, curated by Bruno Coelho. Technology leadership across Europe, Asia-Pacific and the Middle East.
        </p>
        <p class="site-footer-meta">
          <a href="{{ '/subscribe/' | relative_url }}">Subscribe</a>
          <span aria-hidden="true">·</span>
          <a href="{{ '/feed-en.xml' | relative_url }}">RSS</a>
          <span aria-hidden="true">·</span>
          <a href="https://www.linkedin.com/in/bracoelho/">LinkedIn</a>
        </p>
      </footer>
    </main>
  </body>
</html>
