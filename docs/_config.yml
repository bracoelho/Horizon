# No theme: docs/_layouts/default.html is our own shell.
title: AI Radar
description: "Early warning on AI and agentic AI, curated by Bruno Coelho"
baseurl: "" # served at the domain root, not a /Horizon subpath
url: "https://radar.bcoelho.com" # custom domain; see docs/CNAME

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
plugins:
  - jekyll-feed
feed:
  path: feed.xml
exclude:
  - ".github"
  - "node_modules"
  # Upstream Horizon's own engine documentation. It belongs in this repository,
  # which forked that engine, and it has no business on a site that carries the
  # owner's byline. Each of these rendered inside the radar's layout at a .html
  # URL, so the header above them read "AI Radar, curated by Bruno Coelho":
  # 73 em dashes against STYLE.md's ban, 51 mentions of the forked tool, and a
  # product design document for a product that is not his. Orphaned from every
  # nav, with no robots.txt, so the exposure was a search engine rather than a
  # reader (NEWS-Radar N-085, 2026-09-06). Attribution is untouched and
  # deliberate: NOTICE.md and /method/ both credit Horizon.
  - "configuration.md"
  - "scoring.md"
  - "profiles.md"
  - "scrapers.md"
  - "extractors.md"
  - "horizon-hub-design.md"

collections:
  commentary:
    output: true
    permalink: /commentary/:name/
  # One document per published item. The pipeline writes these alongside the
  # digest so the site can lead with what was found rather than with a log of
  # when it ran, and so a single item can be linked to on its own.
  items:
    output: true
    permalink: /item/:name/
  # The Firsthand Playbook: operational artifacts of Bruno's own, from
  # experiment to framework. Individual entries commonly override this
  # permalink to keep a URL stable across the move into this collection
  # (agent-contract.md keeps /agent-contract/, not /playbook/agent-contract/).
  playbook:
    output: true
    permalink: /playbook/:name/

# The reading order of the themes, and the question each one answers. Held here
# rather than derived from the profiles, because the site needs the order even
# on a day when a theme is empty.
themes:
  - id: reliability-assurance
    name: Reliability &amp; Assurance
    question: Who is exposed, and what should they check?
  - id: critical-infrastructure
    name: Critical Infrastructure
    question: What would an operator do differently?
  - id: business-markets
    name: Business &amp; Markets
    question: What changes commercially, and for whom?
  - id: practice
    name: Practice
    question: What would a team do differently this quarter?
  - id: horizon-research
    name: Horizon
    question: What would have to be true for this to matter?

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "commentary"
    values:
      layout: "commentary"
  - scope:
      path: ""
      type: "playbook"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "items"
    values:
      layout: "item"
