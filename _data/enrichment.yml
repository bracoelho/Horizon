    text: "GAUGE shows LLM-judge release gates can promote the wrong agent: 57.5% of conversations rated satisfied failed the task, and close rankings disagree 31% of the time, so calibrate judges first."
    basis: "First, a satisfaction-success gap: satisfaction carries essentially no information about task success, as conversations rated satisfied by our blind panel are decorrelated from actual success, with 57.5% of them failing the customer's task, a pattern consistent across five rater populations, both benchmarks, and every subjective dimension we rated. Second, while the gate's ranking is robust across the broad capability span, it loses resolution among the near-equal strong agents: this decision-disagreement rate jumps from $<$1% on wide-reward pairs to 31% on close pairs."
