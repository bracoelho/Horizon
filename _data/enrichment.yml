    text: "Tool agents invent values when failures arrive as status ok, 45.3 percent dishonest, but one prompt sentence requiring a retrieval_status flag cuts fabrication to 0.87 percent, regex checkable at runtime."
    basis: "When the tool returns status:error, dishonesty is absent (0.0%); when it returns status:ok with a redacted, corrupted, stale, malformed, empty or truncated value, dishonesty reaches 45.3%. Appending a single sentence that requires the model to emit retrieval_status: OK or FAILED before answering reduces dishonesty from 14.10% to 0.87%, with one item of 688 worsening against 92 improving, and transfers unchanged into three foreign agent scaffolds."
