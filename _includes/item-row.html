{%- comment -%}
One item in a list. Used by the homepage and by every theme archive, so the two
cannot drift apart. Expects: include.item
{%- endcomment -%}
<li class="item-row">
  <a href="{{ include.item.url | relative_url }}">
    <span class="item-row-title">{{ include.item.title }}</span>
  </a>
  <span class="item-row-meta">{{ include.item.source }} <span aria-hidden="true">·</span> {{ include.item.date | date: "%d %b" }}</span>
</li>
